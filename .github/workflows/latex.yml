name: build-pdf
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Latex/main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: Latex/main.pdf
